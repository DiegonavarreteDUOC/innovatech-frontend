name: CI/CD Pipeline - Frontend

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/innovatech-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to EC2 Frontend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_FRONT_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Parar y borrar contenedor anterior si existe
            docker stop front-despacho || true
            docker rm front-despacho || true
            
            # Limpiar imágenes viejas
            docker image prune -f || true
            
            # Pull de la nueva imagen
            docker pull ${{ secrets.DOCKER_USERNAME }}/innovatech-frontend:latest
            
            # Correr contenedor con variable de entorno del Backend
            docker run -d \
              --name front-despacho \
              -p 80:80 \
              -e BACKEND_IP=${{ secrets.EC2_BACK_IP }} \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/innovatech-frontend:latest
